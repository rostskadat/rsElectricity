[workspace]
members = ["crates/common", "crates/gsheet","crates/cache","crates/extractor", "crates/workbook"]
default-members = [".", "crates/common", "crates/cache", "crates/extractor", "crates/workbook"]
resolver = "3"

[package]
name = "rsElectricity"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
serde_json = "1.0"
regex = "1.10"
chrono = { version = "0.4", features = ["serde"] }
csv = "1.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"
anyhow = "1.0"
thiserror = "1.0"
walkdir = "2.5"
indexmap = { version = "2.0", features = ["serde"] }
extractor = { version = "0.1.0", path = "crates/extractor" }
cache = { version = "0.1.0", path = "crates/cache" }
common = { version = "0.1.0", path = "crates/common" }
gsheet = { version = "0.1.0", path = "crates/gsheet" }
workbook = { version = "0.1.0", path = "crates/workbook" }
