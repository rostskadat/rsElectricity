[package]
name = "gsheet"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
futures-util = "0.3"
indexmap = "2.0"
google-sheets4 = "7.0.0"
hyper = "1.12.0"
hyper-rustls = { version = "0.27.10", default-features = false, features = ["ring", "native-tokio", "http1", "http2", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["client-legacy", "http2", "tokio"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tracing = "0.1"
common = { path = "../common" }
yup-oauth2 = "12.1.2"
